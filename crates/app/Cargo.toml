[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
rustplus = { path = "../rustplus" }
push-receiver = { path = "../push_receiver" }

# Async / Core
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true

# UI & Tray
eframe = "0.30"
tray-icon = "0.19"
wry = "0.48"

# OS Integrations
notify-rust = "4.11"
winit = "0.30"
directories = "6.0.0"
uuid = { workspace = true, features = ["v4"] }
mac-notification-sys = "0.6.15"

[build-dependencies]
winres = "0.1"
