name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.os_name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os_name: macOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: app
            name: NODIrust-macOS-arm64.dmg
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: app.exe
            name: nodirust-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
          
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        
      - name: Build binary
        run: cargo build -p app --release --target ${{ matrix.platform.target }}
        
      - name: Create macOS App Bundle and DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p "NODIrust.app/Contents/MacOS"
          mkdir -p "NODIrust.app/Contents/Resources"
          cp "target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }}" "NODIrust.app/Contents/MacOS/NODIrust"
          
          # Convert icon if present
          if [ -f "crates/app/assets/app.ico" ]; then
            sips -s format icns "crates/app/assets/app.ico" --out "NODIrust.app/Contents/Resources/AppIcon.icns" || true
          fi
          
          # Create a basic Info.plist
          cat > "NODIrust.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>NODIrust</string>
              <key>CFBundleIdentifier</key>
              <string>com.nodirust.app</string>
              <key>CFBundleName</key>
              <string>NODIrust</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
          </dict>
          </plist>
          EOF
          
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install create-dmg
          create-dmg \
            --volname "NODIrust Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "NODIrust.app" 200 190 \
            --hide-extension "NODIrust.app" \
            --app-drop-link 600 185 \
            "${{ matrix.platform.name }}" \
            "NODIrust.app"
          
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "target\${{ matrix.platform.target }}\release\${{ matrix.platform.bin }}" -DestinationPath "${{ matrix.platform.name }}"
          
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.name }}
          path: ${{ matrix.platform.name }}
          
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
