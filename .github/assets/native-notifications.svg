<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title description">
  <title id="title">NODIrust notification banners</title>
  <desc id="description">A Smart Alarm presented as native macOS and Windows 11 notification banners.</desc>
  <defs>
    <linearGradient id="backdropShade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#080512" stop-opacity="0.18"/>
      <stop offset="0.52" stop-color="#080512" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#080512" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="liquidGlass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.34" stop-color="#e6e0f2" stop-opacity="0.21"/>
      <stop offset="0.72" stop-color="#7d718d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="liquidShade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#15101f" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="#0b0811" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#07050b" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="liquidRim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.74"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="acrylic" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#30303b" stop-opacity="0.89"/>
      <stop offset="0.5" stop-color="#24232e" stop-opacity="0.87"/>
      <stop offset="1" stop-color="#191923" stop-opacity="0.91"/>
    </linearGradient>
    <linearGradient id="acrylicRim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.31"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.19"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect width="1600" height="600" rx="34"/>
    </clipPath>
    <clipPath id="macClip">
      <rect x="70" y="204" width="700" height="218" rx="36"/>
    </clipPath>
    <clipPath id="windowsClip">
      <rect x="830" y="204" width="700" height="218" rx="16"/>
    </clipPath>
    <filter id="glassBlur" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
      <feColorMatrix type="saturate" values="1.25"/>
    </filter>
    <filter id="macShadow" x="-25%" y="-70%" width="150%" height="250%">
      <feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#08040e" flood-opacity="0.62"/>
    </filter>
    <filter id="windowsShadow" x="-25%" y="-70%" width="150%" height="250%">
      <feDropShadow dx="0" dy="18" stdDeviation="23" flood-color="#08040e" flood-opacity="0.66"/>
    </filter>
    <filter id="iconShadow" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.50"/>
    </filter>
  </defs>

  <g clip-path="url(#canvasClip)">
    <image href="liquidpurple.jpeg" width="1600" height="600" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1600" height="600" fill="url(#backdropShade)"/>
  </g>
  <rect x="0.75" y="0.75" width="1598.5" height="598.5" rx="33.25" fill="none" stroke="#9d86c4" stroke-opacity="0.34" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable', 'Segoe UI', Arial, sans-serif">
    <text x="70" y="175" fill="#ffffff" fill-opacity="0.86" font-size="17" font-weight="650">macOS</text>
    <text x="1530" y="175" text-anchor="end" fill="#ffffff" fill-opacity="0.86" font-size="17" font-weight="650">Windows 11</text>

    <g filter="url(#macShadow)">
      <rect x="70" y="204" width="700" height="218" rx="36" fill="#16101e" fill-opacity="0.44"/>
      <g clip-path="url(#macClip)">
        <image href="liquidpurple.jpeg" width="1600" height="600" preserveAspectRatio="xMidYMid slice" filter="url(#glassBlur)"/>
      </g>
      <rect x="70" y="204" width="700" height="218" rx="36" fill="url(#liquidGlass)"/>
      <rect x="70" y="204" width="700" height="218" rx="36" fill="url(#liquidShade)"/>
      <rect x="70.75" y="204.75" width="698.5" height="216.5" rx="35.25" fill="none" stroke="url(#liquidRim)" stroke-width="1.5"/>
      <path d="M108 206h624c17 0 31 11 35 28" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.5" stroke-linecap="round"/>

      <image href="app-icon.png" x="98" y="232" width="88" height="88" preserveAspectRatio="xMidYMid meet" filter="url(#iconShadow)"/>
      <text x="208" y="252" fill="#f8f9fb" font-size="18" font-weight="650">NODIrust</text>
      <text x="720" y="252" text-anchor="end" fill="#ece9f0" fill-opacity="0.72" font-size="15">now</text>
      <text x="208" y="311" fill="#ffffff" font-size="27" font-weight="700">Smart Alarm</text>
      <text x="208" y="355" fill="#f6f4f8" font-size="20" font-weight="450">Your base is under attack!</text>
    </g>

    <g font-family="'Segoe UI Variable', 'Segoe UI', Arial, sans-serif" filter="url(#windowsShadow)">
      <rect x="830" y="204" width="700" height="218" rx="16" fill="#1c1924"/>
      <g clip-path="url(#windowsClip)">
        <image href="liquidpurple.jpeg" width="1600" height="600" preserveAspectRatio="xMidYMid slice" filter="url(#glassBlur)" opacity="0.42"/>
      </g>
      <rect x="830" y="204" width="700" height="218" rx="16" fill="url(#acrylic)"/>
      <rect x="830.75" y="204.75" width="698.5" height="216.5" rx="15.25" fill="none" stroke="url(#acrylicRim)" stroke-width="1.5"/>
      <path d="M846 205h668c8 0 15 5 16 13" fill="none" stroke="#ffffff" stroke-opacity="0.17" stroke-linecap="round"/>

      <image href="app-icon.png" x="857" y="226" width="66" height="66" preserveAspectRatio="xMidYMid meet" filter="url(#iconShadow)"/>
      <text x="942" y="252" fill="#f4f7fa" font-size="16" font-weight="600">NODIrust</text>
      <text x="1480" y="252" text-anchor="end" fill="#d4d0db" fill-opacity="0.74" font-size="14">now</text>
      <text x="858" y="331" fill="#ffffff" font-size="25" font-weight="600">Smart Alarm</text>
      <text x="858" y="373" fill="#f0edf4" font-size="19">Your base is under attack!</text>
    </g>
  </g>
</svg>
